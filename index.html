<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Emeği & Taş Tozu Tasarımlar - Alışveriş Sitesi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f5f5f5; color: #333; }
    
    /* Header */
    header { background-color: #d87d4a; color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    header h1 { font-size: 20px; }
    .header-btns { display: flex; gap: 10px; }
    .header-btns button { background: white; color: #d87d4a; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    .header-btns button:hover { background: #fdf0e9; }

    /* Ana Alan */
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    
    /* Yönetici Paneli Formu */
    .admin-panel { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; border: 2px solid #d87d4a; }
    .admin-panel h2 { margin-bottom: 15px; color: #d87d4a; }
    .form-row { display: flex; gap: 10px; }
    .form-group { margin-bottom: 12px; flex: 1; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    
    .admin-btn-group { display: flex; gap: 10px; margin-top: 10px; }
    .btn-add { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 2; }
    .btn-cancel-edit { background: #95a5a6; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; flex: 1; display: none; }

    /* Ürün Izgarası */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    
    /* Ürün Kartı */
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; display: flex; flex-direction: column; cursor: pointer; }
    .card:hover { transform: translateY(-3px); }
    .card img { width: 100%; height: 220px; object-fit: cover; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #222; }
    
    /* Ölçü & Ağırlık Etiketleri */
    .specs-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .tag { font-size: 11px; color: #555; background: #f0f0f0; padding: 3px 7px; border-radius: 4px; border: 1px solid #e0e0e0; }

    .card-price { font-size: 18px; color: #d87d4a; font-weight: bold; margin-bottom: 12px; }
    .card-actions { margin-top: auto; display: flex; gap: 5px; flex-direction: column; }
    .btn-add-cart { background: #d87d4a; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-edit { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

    /* Modal Genel Stili */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #888; }
    
    /* Ürün Detay Modalı */
    .detail-img { width: 100%; height: 260px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; }
    .detail-specs { background: #fafafa; border: 1px dashed #ddd; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 13px; line-height: 1.6; }
    .detail-desc { margin: 10px 0; line-height: 1.5; color: #555; }

    /* Sepet Listesi */
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
    .cart-item-info { font-size: 14px; }
    .cart-item-sub { font-size: 11px; color: #777; }
    .cart-total { font-size: 18px; font-weight: bold; text-align: right; margin-top: 15px; color: #d87d4a; }
    .btn-send-wa { background: #25D366; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-weight: bold; margin-top: 15px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <!-- Üst Menü -->
  <header>
    <h1>Dekoratif Taş Tozu & Sepet Mağazası</h1>
    <div class="header-btns">
      <button onclick="sepetiAc()">🛒 Sepetim (<span id="cartCount">0</span>)</button>
      <button onclick="toggleAdmin()">Yönetici Paneli</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Yönetici Paneli -->
    <div id="adminPanel" class="admin-panel">
      <h2 id="adminFormTitle">Yeni Obje / Sepet Ekle</h2>
      <div class="form-group">
        <label>Ürün Adı</label>
        <input type="text" id="pName" placeholder="Örn: Taş Tozu Dekoratif Tepsi, Örgü İp Sepet">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Boyut (cm)</label>
          <input type="text" id="pDimensions" placeholder="Örn: 15x20 cm">
        </div>
        <div class="form-group">
          <label>Ağırlık (gr / kg)</label>
          <input type="text" id="pWeight" placeholder="Örn: 450 gr">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Fiyat (TL)</label>
          <input type="number" id="pPrice" placeholder="Örn: 180">
        </div>
        <div class="form-group">
          <label>Stok Adedi</label>
          <input type="number" id="pStock" placeholder="Örn: 10">
        </div>
      </div>

      <div class="form-group">
        <label>Görsel Bağlantısı (URL)</label>
        <input type="text" id="pImg" placeholder="https://resim-linki.com/foto.jpg">
      </div>
      <div class="form-group">
        <label>Açıklama / Vernik / Malzeme Detayı</label>
        <textarea id="pDesc" rows="3" placeholder="Örn: Birinci sınıf taş tozundan dökülmüştür..."></textarea>
      </div>

      <div class="admin-btn-group">
        <button id="submitBtn" class="btn-add" onclick="urunKaydet()">Ürünü Mağazaya Ekle</button>
        <button id="cancelEditBtn" class="btn-cancel-edit" onclick="duzenlemeyiIptalEt()">İptal</button>
      </div>
    </div>

    <!-- Ürün Listesi -->
    <div id="productGrid" class="grid"></div>

  </div>

  <!-- ÜRÜN DETAY MODALI -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="kapatModal('detailModal')">&times;</span>
      <img id="modalImg" class="detail-img" src="" alt="">
      <h2 id="modalTitle"></h2>
      
      <div class="detail-specs">
        <div id="modalDimensions"></div>
        <div id="modalWeight"></div>
        <div id="modalStock"></div>
      </div>

      <div id="modalPrice" class="card-price"></div>
      <div id="modalDesc" class="detail-desc"></div>
      <button id="modalAddBtn" class="btn-add-cart" style="width: 100%;">Sepete Ekle</button>
    </div>
  </div>

  <!-- SEPET MODALI -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="kapatModal('cartModal')">&times;</span>
      <h2>Alışveriş Sepetim</h2>
      <div id="cartList" style="margin-top: 15px;"></div>
      <div id="cartTotal" class="cart-total">Toplam: 0 TL</div>
      <button class="btn-send-wa" onclick="whatsappSiparisGonder()">WhatsApp ile Siparişi Tamamla</button>
    </div>
  </div>

  <!-- Firebase Modülleri -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Ayarlarınız
    const firebaseConfig = {
      apiKey: "AIzaSyByNELK5X2eqYQqe1SVX5z7wzZH8ureRkg",
      authDomain: "site-6efbc.firebaseapp.com",
      databaseURL: "https://site-6efbc-default-rtdb.firebaseio.com",
      projectId: "site-6efbc",
      storageBucket: "site-6efbc.firebasestorage.app",
      messagingSenderId: "610452896455",
      appId: "1:610452896455:web:1bd8eeb452b0a96f9a9ce2",
      measurementId: "G-EP2XBVVHH4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const urunlerRef = ref(db, 'urunler');

    const WHATSAPP_NO = "905446374940"; 
    const ADMIN_SIFRE = "1234"; 

    let isAdminLoggedIn = false;
    let editingId = null;
    let sepet = JSON.parse(localStorage.getItem('musteriSepet')) || [];
    let urunler = [];

    document.getElementById('cartCount').innerText = sepet.length;

    function sepetiKaydet() {
      localStorage.setItem('musteriSepet', JSON.stringify(sepet));
      document.getElementById('cartCount').innerText = sepet.length;
    }

    // Veritabanını Anlık Dinle
    onValue(urunlerRef, (snapshot) => {
      const data = snapshot.val();
      urunler = [];
      if (data) {
        Object.keys(data).forEach(key => {
          urunler.push({ firebaseId: key, ...data[key] });
        });
      }
      urunleriListele();
    });

    // Ürünleri Listeleme
    window.urunleriListele = function() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (urunler.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 40px 0;">Henüz hiç ürün eklenmemiş.</p>';
        return;
      }

      urunler.forEach(urun => {
        const stokBitti = (urun.stock !== undefined && Number(urun.stock) <= 0);
        
        const stokEtiketi = stokBitti 
          ? `<span class="tag" style="background:#e74c3c; color:white; font-weight:bold;">Stok Tükendi</span>` 
          : `<span class="tag" style="background:#27ae60; color:white;">Stok: ${urun.stock ?? 0}</span>`;

        const sepeteEkleBtn = stokBitti
          ? `<button class="btn-add-cart" style="background:#ccc; cursor:not-allowed;" disabled>Tükendi</button>`
          : `<button class="btn-add-cart" onclick="sepeteEkle('${urun.firebaseId}')">Sepete Ekle</button>`;

        grid.innerHTML += `
          <div class="card" onclick="detayGoster('${urun.firebaseId}')">
            <img src="${urun.img}" alt="${urun.name}" onerror="this.src='https://via.placeholder.com/300'">
            <div class="card-body">
              <div class="card-title">${urun.name}</div>
              
              <div class="specs-tags">
                ${urun.dimensions ? `<span class="tag">📐 ${urun.dimensions}</span>` : ''}
                ${urun.weight ? `<span class="tag">⚖️ ${urun.weight}</span>` : ''}
                ${stokEtiketi}
              </div>

              <div class="card-price">${urun.price} TL</div>
              
              <div class="card-actions" onclick="event.stopPropagation()">
                ${sepeteEkleBtn}
                ${isAdminLoggedIn ? `
                  <button class="btn-edit" onclick="urunDuzenleBaslat('${urun.firebaseId}')">Ürünü Düzenle</button>
                  <button class="btn-delete" onclick="urunSil('${urun.firebaseId}')">Ürünü Sil</button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      });
    }

    // Detay Göster
    window.detayGoster = function(id) {
      const urun = urunler.find(u => u.firebaseId === id);
      if (!urun) return;

      document.getElementById('modalImg').src = urun.img;
      document.getElementById('modalTitle').innerText = urun.name;
      document.getElementById('modalDimensions').innerHTML = urun.dimensions ? `<strong>📐 Ebat / Boyut:</strong> ${urun.dimensions}` : '';
      document.getElementById('modalWeight').innerHTML = urun.weight ? `<strong>⚖️ Ağırlık:</strong> ${urun.weight}` : '';
      
      const stokBitti = (urun.stock !== undefined && Number(urun.stock) <= 0);
      document.getElementById('modalStock').innerHTML = `<strong>📦 Stok Durumu:</strong> ${stokBitti ? 'Tükendi' : urun.stock + ' adet'}`;

      document.getElementById('modalPrice').innerText = urun.price + ' TL';
      document.getElementById('modalDesc').innerText = urun.desc || "Açıklama belirtilmemiş.";
      
      const addBtn = document.getElementById('modalAddBtn');
      if (stokBitti) {
        addBtn.innerText = "Stok Tükendi";
        addBtn.style.background = "#ccc";
        addBtn.disabled = true;
      } else {
        addBtn.innerText = "Sepete Ekle";
        addBtn.style.background = "#d87d4a";
        addBtn.disabled = false;
        addBtn.onclick = function() {
          sepeteEkle(urun.firebaseId);
          kapatModal('detailModal');
        };
      }

      document.getElementById('detailModal').style.display = 'flex';
    }

    // Sepete Ekle - TIKLANDIĞI AN ANINDA STOK DÜŞER!
    window.sepeteEkle = function(id) {
      const urun = urunler.find(u => u.firebaseId === id);
      if (!urun) return;

      const mevcutStok = Number(urun.stock ?? 0);

      if (mevcutStok <= 0) {
        alert("Üzgünüz, bu ürünün stoğu tükenmiştir!");
        return;
      }

      // Veritabanındaki stoğu 1 azalt
      const yeniStok = mevcutStok - 1;
      update(ref(db, 'urunler/' + id), { stock: yeniStok });

      // Sepete ekle ve kaydet
      sepet.push(urun);
      sepetiKaydet();
      alert(`"${urun.name}" sepete eklendi! (Kalan Stok: ${yeniStok})`);
    }

    // Sepetten Çıkar - ÇIKARILDIĞINDA STOK GERİ YÜKLENİR
    window.sepettenCikar = function(index) {
      const cikarilanUrun = sepet[index];
      if (cikarilanUrun) {
        const urun = urunler.find(u => u.firebaseId === cikarilanUrun.firebaseId);
        if (urun) {
          const mevcutStok = Number(urun.stock ?? 0);
          update(ref(db, 'urunler/' + urun.firebaseId), { stock: mevcutStok + 1 });
        }
      }

      sepet.splice(index, 1);
      sepetiKaydet();
      sepetiAc();
    }

    // Sepeti Aç
    window.sepetiAc = function() {
      const cartList = document.getElementById('cartList');
      const cartTotal = document.getElementById('cartTotal');
      cartList.innerHTML = '';

      if (sepet.length === 0) {
        cartList.innerHTML = '<p style="color:#777; text-align:center;">Sepetiniz henüz boş.</p>';
        cartTotal.innerText = 'Toplam: 0 TL';
      } else {
        let toplam = 0;
        sepet.forEach((urun, index) => {
          toplam += Number(urun.price);
          cartList.innerHTML += `
            <div class="cart-item">
              <div class="cart-item-info">
                <strong>${urun.name}</strong>
                <div class="cart-item-sub">
                  ${urun.dimensions ? ` Boyut: ${urun.dimensions}` : ''} 
                  ${urun.weight ? ` | Ağırlık: ${urun.weight}` : ''}
                </div>
                <div style="color:#d87d4a; font-weight:bold; margin-top:2px;">${urun.price} TL</div>
              </div>
              <button onclick="sepettenCikar(${index})" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Çıkar</button>
            </div>
          `;
        });
        cartTotal.innerText = `Toplam: ${toplam} TL`;
      }

      document.getElementById('cartModal').style.display = 'flex';
    }

    // WhatsApp Sipariş
    window.whatsappSiparisGonder = function() {
      if (sepet.length === 0) {
        alert("Sepetiniz boş!");
        return;
      }

      let mesaj = "Merhaba, sitenizden şu el yapımı ürünleri sipariş vermek istiyorum:\n\n";
      let toplam = 0;

      sepet.forEach((item, i) => {
        let detay = [];
        if (item.dimensions) detay.push(item.dimensions);
        if (item.weight) detay.push(item.weight);
        const detayMetni = detay.length > 0 ? ` (${detay.join(', ')})` : '';

        mesaj += `${i + 1}. ${item.name}${detayMetni} - ${item.price} TL\n`;
        toplam += Number(item.price);
      });

      mesaj += `\n*Toplam Tutar:* ${toplam} TL`;

      const waLink = `https://wa.me/${WHATSAPP_NO}?text=${encodeURIComponent(mesaj)}`;
      
      sepet = [];
      sepetiKaydet();
      kapatModal('cartModal');
      
      window.open(waLink, '_blank');
    }

    // Yönetici Girişi
    window.toggleAdmin = function() {
      if (!isAdminLoggedIn) {
        const sifre = prompt("Yönetici şifresini girin:");
        if (sifre === ADMIN_SIFRE) {
          isAdminLoggedIn = true;
          document.getElementById('adminPanel').style.display = 'block';
          urunleriListele();
          alert("Giriş başarılı!");
        } else if (sifre !== null) {
          alert("Hatalı şifre!");
        }
      } else {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      }
    }

    // Ürün Düzenlemeyi Başlat
    window.urunDuzenleBaslat = function(id) {
      const urun = urunler.find(u => u.firebaseId === id);
      if (!urun) return;

      document.getElementById('pName').value = urun.name;
      document.getElementById('pDimensions').value = urun.dimensions || '';
      document.getElementById('pWeight').value = urun.weight || '';
      document.getElementById('pPrice').value = urun.price;
      document.getElementById('pStock').value = urun.stock ?? 0;
      document.getElementById('pImg').value = urun.img;
      document.getElementById('pDesc').value = urun.desc || '';

      editingId = id;
      document.getElementById('adminFormTitle').innerText = "Ürünü Düzenle";
      document.getElementById('submitBtn').innerText = "Ürün Bilgilerini Güncelle";
      document.getElementById('cancelEditBtn').style.display = 'block';

      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth' });
    }

    // Düzenlemeyi İptal Et
    window.duzenlemeyiIptalEt = function() {
      editingId = null;
      document.getElementById('adminFormTitle').innerText = "Yeni Obje / Sepet Ekle";
      document.getElementById('submitBtn').innerText = "Ürünü Mağazaya Ekle";
      document.getElementById('cancelEditBtn').style.display = 'none';
      formuTemizle();
    }

    // Formu Temizleme
    function formuTemizle() {
      document.getElementById('pName').value = '';
      document.getElementById('pDimensions').value = '';
      document.getElementById('pWeight').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pStock').value = '';
      document.getElementById('pImg').value = '';
      document.getElementById('pDesc').value = '';
    }

    // Ürün Ekle veya Güncelle
    window.urunKaydet = function() {
      const name = document.getElementById('pName').value.trim();
      const dimensions = document.getElementById('pDimensions').value.trim();
      const weight = document.getElementById('pWeight').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const stock = document.getElementById('pStock').value.trim();
      const img = document.getElementById('pImg').value.trim();
      const desc = document.getElementById('pDesc').value.trim();

      if (!name || !price || !img || stock === "") {
        alert("Lütfen ürün adı, fiyatı, stok adedi ve görsel bağlantısını doldurun!");
        return;
      }

      const yeniUrun = {
        name: name,
        dimensions: dimensions,
        weight: weight,
        price: Number(price),
        stock: Number(stock),
        img: img,
        desc: desc
      };

      if (editingId) {
        set(ref(db, 'urunler/' + editingId), yeniUrun).then(() => {
          alert("Ürün başarıyla güncellendi!");
          duzenlemeyiIptalEt();
        });
      } else {
        push(urunlerRef, yeniUrun).then(() => {
          alert("Yeni ürün eklendi!");
          formuTemizle();
        });
      }
    }

    // Ürün Sil
    window.urunSil = function(id) {
      if (confirm("Bu ürünü silmek istediğinize emin misiniz?")) {
        remove(ref(db, 'urunler/' + id)).then(() => {
          alert("Ürün silindi.");
        });
      }
    }

    window.kapatModal = function(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
